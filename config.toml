# Configuração do recomendador. Pesos e limites ajustáveis só com `recs eval` comparativo.

[tmdb]
concurrency = 20
metadata_ttl_days = 90
providers_ttl_days = 7
search_ttl_days = 90

[match]
# Os nomes do export do Letterboxd vêm em inglês; buscar em en-US deixa a comparação de títulos direta.
search_language = "en-US"
accept_threshold = 0.85   # score combinado mínimo (0.7·título + 0.3·ano) na busca ampliada
min_margin = 0.03         # vantagem mínima do melhor sobre o segundo candidato
review_below = 0.90       # matches aceitos abaixo disso aparecem como "ambíguos"

[profile]
unrated_weight = 0.1
liked_bonus = 0.2         # likes do Letterboxd (sinal leve; a confirmar no eval)
feedback_good_weight = 0.3
shrinkage_k = 2.0

[profile.feature_weights]
director = 3.0
writer = 1.5
cinematographer = 1.5
editor = 0.8
composer = 0.5
country = 1.0
language = 1.0
decade = 0.5
keyword = 1.0
genre = 0.3

[candidates]
seed_min_rating = 4.0
top_directors = 25
top_cinematographers = 10
top_writers = 10
watchlist_boost = 1.3

[score]
popularity_alpha = 0.15
min_vote_count = 20
min_runtime = 60
include_shorts = false
include_documentaries = true
max_per_director = 2
# Tipos somados; os demais entram pela média no filme (evita inflar antologias e coproduções).
sum_feature_types = ["keyword"]

[availability]
region = "BR"
provedores_assinados = ["Netflix", "Amazon Prime Video", "HBO Max", "Disney Plus", "Apple TV", "MUBI"]

[eval]
holdout = 0.15
min_rating = 4.5
seeds = [1, 2, 3, 4, 5]
